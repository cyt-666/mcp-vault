name: Release readiness

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gates:
    name: Release functional gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml
      # Build before cargo test because server Admin assets are embedded at
      # compile time from the ignored frontend/admin/dist directory.
      - name: Build Admin assets for Rust embedding
        run: |
          CI=true pnpm --dir frontend/admin install --frozen-lockfile
          CI=true pnpm --dir frontend/admin build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: CI=true pnpm --dir frontend/admin lint
      - run: CI=true pnpm --dir frontend/admin test
      - run: bash scripts/check-docs.sh
      - run: bash scripts/interop/http-smoke.sh
      - name: Official MCP conformance
        env:
          MCP_VAULT_CONFORMANCE_OUTPUT_DIR: ${{ runner.temp }}/mcp-vault-conformance
        run: bash scripts/conformance/mcp.sh
      - name: Migration and performance evidence
        env:
          MCP_VAULT_PERF_REPORT: ${{ runner.temp }}/mcp-vault-perf-report.json
        run: |
          bash scripts/release/check-migrations.sh
          bash scripts/perf/baseline.sh
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-vault-release-functional-evidence
          path: |
            ${{ runner.temp }}/mcp-vault-conformance
            ${{ runner.temp }}/mcp-vault-perf-report.json
          if-no-files-found: warn

  image:
    name: Release image integrity
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release image once
        run: docker build --tag mcp-vault:release .
      - name: Assert hardened runtime
        run: |
          test "$(docker image inspect mcp-vault:release --format '{{.Config.User}}')" != ""
          test "$(docker image inspect mcp-vault:release --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect mcp-vault:release --format '{{.Config.StopSignal}}')" = "SIGTERM"
          test "$(docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --entrypoint id mcp-vault:release -u)" != "0"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: mcp-vault:release
          format: spdx-json
          output-file: sbom-mcp-vault-release.json
      - name: Scan release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-vault:release
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Create digest-bound artifact manifest
        shell: bash
        run: |
          docker image inspect mcp-vault:release > image-inspect.json
          image_id="$(docker image inspect mcp-vault:release --format '{{.Id}}')"
          printf 'image_id=%s\ngit_revision=%s\n' "$image_id" "$GITHUB_SHA" > release-manifest.txt
          docker save mcp-vault:release | gzip > mcp-vault-release-image.tar.gz
          sha256sum release-manifest.txt image-inspect.json sbom-mcp-vault-release.json mcp-vault-release-image.tar.gz > SHA256SUMS.release
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-vault-release-artifacts
          path: |
            release-manifest.txt
            image-inspect.json
            sbom-mcp-vault-release.json
            mcp-vault-release-image.tar.gz
            SHA256SUMS.release

  signature:
    name: Verify declared release signature
    if: ${{ vars.MCP_VAULT_SIGNED_IMAGE_REF != '' }}
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v3.8.1
      - name: Verify image signature supplied by release infrastructure
        env:
          IMAGE_REF: ${{ vars.MCP_VAULT_SIGNED_IMAGE_REF }}
          CERTIFICATE_IDENTITY: ${{ vars.MCP_VAULT_SIGNING_IDENTITY_REGEXP }}
          OIDC_ISSUER: ${{ vars.MCP_VAULT_SIGNING_OIDC_ISSUER }}
        run: |
          test -n "$CERTIFICATE_IDENTITY"
          test -n "$OIDC_ISSUER"
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER"
