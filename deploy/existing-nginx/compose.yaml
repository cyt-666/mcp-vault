services:
  mcp-vault:
    image: mcp-vault:0.2.1
    platform: linux/amd64
    pull_policy: never
    # GUI-managed NAS bind mounts are commonly owned by a host-only UID.
    # Run as root with only DAC_OVERRIDE retained so /data remains writable
    # without granting a privileged container.
    user: "0:0"
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      # Replace this with the absolute persistent directory on the NAS.
      - /path/on/nas/mcp-vault:/data
    environment:
      MCP_VAULT_DATA_DIR: /data
      MCP_VAULT_SECRETS_DIR: /data/secrets
      MCP_VAULT_DATA_BIND: 0.0.0.0:8080
      MCP_VAULT_ADMIN_BIND: 0.0.0.0:8081
      MCP_VAULT_DATA_HOSTS: mcp-vault.cyt.cool
      MCP_VAULT_DATA_ORIGINS: https://mcp-vault.cyt.cool
      MCP_VAULT_DATA_PUBLIC_ORIGIN: https://mcp-vault.cyt.cool
      # Replace the example NAS LAN IP with the address used by local browsers.
      MCP_VAULT_ADMIN_ORIGINS: "https://mcp-vault.cyt.cool:8444,http://192.168.1.20:8081"
      MCP_VAULT_BACKUP_DIR: /data/backups
      MCP_VAULT_METRICS_ENABLED: "false"
      MCP_VAULT_LOG_FORMAT: json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    pids_limit: 256
    mem_limit: 2g
