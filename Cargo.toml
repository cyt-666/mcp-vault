[workspace]
members = [
    "crates/domain",
    "crates/vault-core",
    "crates/storage-fs",
    "crates/state",
    "crates/auth",
    "crates/webdav",
    "crates/mcp",
    "crates/indexer",
    "crates/memory",
    "crates/providers",
    "crates/admin-api",
    "crates/backup",
    "crates/server",
]
default-members = ["crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
axum = "0.8"
async-trait = "=0.1.92"
argon2 = "=0.5.3"
base64 = "=0.22.1"
bytes = "1"
comrak = "=0.54.0"
fastembed = "=5.17.4"
dav-server = "=0.11.0"
fs2 = "=0.4.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hmac = "=0.12.1"
http = "=1.5.0"
http-body-util = "0.1"
mime_guess = "2"
opentelemetry = "=0.31.0"
opentelemetry-otlp = { version = "=0.31.0", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["trace", "rt-tokio"] }
percent-encoding = "2"
rmcp = { version = "=3.0.1", features = ["server"] }
rsa = { version = "=0.9.10", features = ["sha2"] }
rust-embed = "8"
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
subtle = "=2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tempfile = "3"
tracing = "0.1"
tracing-opentelemetry = "=0.32.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "=0.8.7"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
url = "=2.5.8"
zeroize = "=1.9.0"

# Decisions recorded for later work packages. These are intentionally pinned
# when their implementation crates start using them.
chacha20poly1305 = "=0.10.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }
sha2 = "=0.10.9"
tar = "=0.4.45"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
